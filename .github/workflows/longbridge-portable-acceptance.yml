name: Longbridge portable OAuth acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/longbridge-portable-acceptance.yml

permissions:
  contents: read

concurrency:
  group: longbridge-portable-oauth-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Longbridge CLI
        id: install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://open.longbridge.com/longbridge/longbridge-terminal/install | sh
          longbridge_bin="$(command -v longbridge || true)"
          if [[ -z "$longbridge_bin" ]]; then
            for candidate in "$HOME/.local/bin/longbridge" "$HOME/bin/longbridge" "/usr/local/bin/longbridge"; do
              if [[ -x "$candidate" ]]; then
                longbridge_bin="$candidate"
                break
              fi
            done
          fi
          test -n "$longbridge_bin"
          echo "$(dirname "$longbridge_bin")" >> "$GITHUB_PATH"
          echo "binary=$longbridge_bin" >> "$GITHUB_OUTPUT"
          "$longbridge_bin" -V

      - name: Refresh and persist portable OAuth
        id: oauth
        shell: bash
        env:
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_REFRESH_TOKEN: ${{ secrets.LONGBRIDGE_OAUTH_REFRESH_TOKEN }}
          LONGBRIDGE_NEXT_REFRESH_TOKEN_PATH: ${{ runner.temp }}/longbridge-next-refresh-token
          GH_TOKEN: ${{ secrets.LONGBRIDGE_SECRET_ROTATOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${LONGBRIDGE_OAUTH_CLIENT_ID:-}"
          test -n "${LONGBRIDGE_OAUTH_REFRESH_TOKEN:-}"
          test -n "${GH_TOKEN:-}"

          python scripts/prepare_longbridge_oauth_session.py > "$RUNNER_TEMP/oauth-safe-summary.json"

          next_refresh_token="$(cat "$LONGBRIDGE_NEXT_REFRESH_TOKEN_PATH")"
          test -n "$next_refresh_token"
          echo "::add-mask::$next_refresh_token"
          printf '%s' "$next_refresh_token" | \
            gh secret set LONGBRIDGE_OAUTH_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          rm -f "$LONGBRIDGE_NEXT_REFRESH_TOKEN_PATH"

          echo "refresh_persisted=true" >> "$GITHUB_OUTPUT"

      - name: Validate paper account and connectivity
        shell: bash
        env:
          LONGBRIDGE_BIN: ${{ steps.install.outputs.binary }}
        run: |
          set -euo pipefail
          "$LONGBRIDGE_BIN" auth status --format json > "$RUNNER_TEMP/auth-status.json"
          python scripts/validate_longbridge_auth_status.py "$RUNNER_TEMP/auth-status.json"
          "$LONGBRIDGE_BIN" check --format json > "$RUNNER_TEMP/check.json"
          python scripts/validate_longbridge_check.py "$RUNNER_TEMP/check.json"

      - name: Fetch all configured quotes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          from nasdaq_cafe.collectors.longbridge_cli_quotes import ensure_longbridge_quotes
          from nasdaq_cafe.config import LONGBRIDGE_FIXED_SYMBOLS, RunConfig

          root = Path(tempfile.mkdtemp(prefix="longbridge-portable-acceptance-"))
          output_dir = root / "output"
          raw_dir = output_dir / "raw"
          raw_dir.mkdir(parents=True, exist_ok=True)

          config = RunConfig(
              target_date="2026-08-06",
              refresh=True,
              output_dir=output_dir,
              raw_dir=raw_dir,
              env={},
          )
          result = ensure_longbridge_quotes(config)
          if result.get("status") != "fetched":
              raise SystemExit(f"Longbridge collector failed: {result}")

          payload = json.loads((raw_dir / "longbridge_quotes.json").read_text(encoding="utf-8"))
          items = payload.get("items", [])
          returned = {str(item.get("symbol")) for item in items if isinstance(item, dict)}
          expected = set(LONGBRIDGE_FIXED_SYMBOLS)
          missing = sorted(expected - returned)
          if missing:
              raise SystemExit(f"Missing configured symbols: {missing}")

          report = {
              "schema_version": "1.0",
              "status": "pass",
              "portable_oauth_refresh_persisted": True,
              "paper_account_validated": True,
              "us_openapi_quote_package_validated": True,
              "connectivity_validated": True,
              "quote_item_count": len(items),
              "returned_symbols": sorted(returned),
              "contains_prices": False,
              "contains_oauth_material": False,
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "longbridge-portable-acceptance.json"
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload safe acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: longbridge-portable-acceptance
          path: ${{ runner.temp }}/longbridge-portable-acceptance.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary OAuth material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$HOME/.longbridge/openapi"
          rm -f "$RUNNER_TEMP/longbridge-next-refresh-token"
          rm -f "$RUNNER_TEMP/oauth-safe-summary.json"
          rm -f "$RUNNER_TEMP/auth-status.json"
          rm -f "$RUNNER_TEMP/check.json"
