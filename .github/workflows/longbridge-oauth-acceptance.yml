name: Longbridge OAuth acceptance

on:
  push:
    branches:
      - feat/longbridge-oauth-actions
    paths:
      - .github/workflows/longbridge-oauth-acceptance.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/longbridge-oauth-acceptance.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Longbridge CLI
        id: install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://open.longbridge.com/longbridge/longbridge-terminal/install | sh
          longbridge_bin="$(command -v longbridge || true)"
          if [[ -z "$longbridge_bin" ]]; then
            for candidate in "$HOME/.local/bin/longbridge" "$HOME/bin/longbridge" "/usr/local/bin/longbridge"; do
              if [[ -x "$candidate" ]]; then
                longbridge_bin="$candidate"
                break
              fi
            done
          fi
          test -n "$longbridge_bin"
          echo "$(dirname "$longbridge_bin")" >> "$GITHUB_PATH"
          echo "binary=$longbridge_bin" >> "$GITHUB_OUTPUT"
          "$longbridge_bin" -V

      - name: Restore OAuth archive and validate account
        id: auth
        shell: bash
        env:
          LONGBRIDGE_CLI_AUTH_B64: ${{ secrets.LONGBRIDGE_CLI_AUTH_B64 }}
          LONGBRIDGE_BIN: ${{ steps.install.outputs.binary }}
        run: |
          set -euo pipefail
          if [[ -z "${LONGBRIDGE_CLI_AUTH_B64:-}" ]]; then
            echo "::error::LONGBRIDGE_CLI_AUTH_B64 is not configured."
            exit 1
          fi

          auth_dir="$HOME/.longbridge/openapi"
          archive_path="$RUNNER_TEMP/longbridge-openapi-auth.zip"
          rm -rf "$auth_dir"
          mkdir -p "$auth_dir"
          umask 077
          printf '%s' "$LONGBRIDGE_CLI_AUTH_B64" | base64 --decode > "$archive_path"
          unzip -q "$archive_path" -d "$auth_dir"
          rm -f "$archive_path"
          chmod -R go-rwx "$auth_dir"

          if [[ ! -d "$auth_dir/tokens" ]] || ! find "$auth_dir/tokens" -type f -print -quit | grep -q .; then
            echo "::error::OAuth archive does not contain tokens/<client_id>."
            exit 1
          fi

          before_sha="$({ find "$auth_dir" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"

          "$LONGBRIDGE_BIN" auth status --format json > "$RUNNER_TEMP/auth-status.json"
          python scripts/validate_longbridge_auth_status.py "$RUNNER_TEMP/auth-status.json"
          "$LONGBRIDGE_BIN" check --format json > "$RUNNER_TEMP/check.json"
          python scripts/validate_longbridge_check.py "$RUNNER_TEMP/check.json"

      - name: Run quote-only collector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from nasdaq_cafe.collectors.longbridge_cli_quotes import ensure_longbridge_quotes
          from nasdaq_cafe.config import LONGBRIDGE_FIXED_SYMBOLS, RunConfig

          root = Path(tempfile.mkdtemp(prefix="longbridge-acceptance-"))
          output_dir = root / "output"
          raw_dir = output_dir / "raw"
          raw_dir.mkdir(parents=True, exist_ok=True)
          config = RunConfig(
              target_date="2026-08-06",
              refresh=True,
              output_dir=output_dir,
              raw_dir=raw_dir,
              env={},
          )
          result = ensure_longbridge_quotes(config)
          if result.get("status") != "fetched":
              raise SystemExit(f"collector failed: {result}")

          payload = json.loads((raw_dir / "longbridge_quotes.json").read_text(encoding="utf-8"))
          items = payload.get("items", [])
          returned = {str(item.get("symbol")) for item in items if isinstance(item, dict)}
          expected = set(LONGBRIDGE_FIXED_SYMBOLS)
          missing = sorted(expected - returned)
          if missing:
              raise SystemExit(f"missing symbols: {missing}")

          safe = {
              "schema_version": "1.0",
              "status": "pass",
              "oauth_archive_restored": True,
              "paper_account_validated": True,
              "us_openapi_quote_package_validated": True,
              "connectivity_validated": True,
              "collector_archive_validated": True,
              "quote_item_count": len(items),
              "returned_symbols": sorted(returned),
              "contains_prices": False,
              "contains_oauth_material": False,
          }
          out = Path("/tmp/longbridge-acceptance-base.json")
          out.write_text(json.dumps(safe, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate rotator token and rotate only if needed
        id: rotate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LONGBRIDGE_SECRET_ROTATOR_TOKEN }}
          BEFORE_SHA: ${{ steps.auth.outputs.before_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::LONGBRIDGE_SECRET_ROTATOR_TOKEN is not configured."
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/secrets/LONGBRIDGE_CLI_AUTH_B64" > /dev/null

          auth_dir="$HOME/.longbridge/openapi"
          after_sha="$({ find "$auth_dir" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
          rotation_state="unchanged"
          if [[ "$after_sha" != "$BEFORE_SHA" ]]; then
            archive_path="$RUNNER_TEMP/longbridge-openapi-auth.zip"
            rm -f "$archive_path"
            (cd "$auth_dir" && zip -qr "$archive_path" .)
            encoded="$(base64 -w 0 "$archive_path")"
            echo "::add-mask::$encoded"
            printf '%s' "$encoded" | gh secret set LONGBRIDGE_CLI_AUTH_B64 --repo "$GITHUB_REPOSITORY"
            rm -f "$archive_path"
            rotation_state="rotated"
          fi
          echo "rotation_state=$rotation_state" >> "$GITHUB_OUTPUT"

      - name: Build safe acceptance report
        shell: bash
        env:
          ROTATION_STATE: ${{ steps.rotate.outputs.rotation_state }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/longbridge-acceptance-base.json").read_text(encoding="utf-8"))
          data["rotator_secret_access_validated"] = True
          data["oauth_rotation_state"] = os.environ.get("ROTATION_STATE", "unknown")
          out = Path(os.environ["RUNNER_TEMP"]) / "longbridge-oauth-acceptance.json"
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload safe acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: longbridge-oauth-acceptance
          path: ${{ runner.temp }}/longbridge-oauth-acceptance.json
          if-no-files-found: error
          retention-days: 7
