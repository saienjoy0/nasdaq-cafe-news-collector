name: ChatGPT NASDAQ Cafe collection request

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: chatgpt-nasdaq-cafe-collection
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[NASDAQ Cafe Collect]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      TARGET_WORKFLOW: daily-nasdaq-cafe.yml

    steps:
      - name: Parse and validate collection request
        id: request
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          body = os.environ.get("ISSUE_BODY", "")
          marker = "<!-- nasdaq-cafe-collection-request -->"
          if marker not in body:
              raise SystemExit("Issue request marker is missing.")

          date_match = re.search(
              r"(?m)^\s*date:\s*(today|\d{4}-\d{2}-\d{2})\s*$",
              body,
          )
          refresh_match = re.search(
              r"(?mi)^\s*refresh:\s*(true|false)\s*$",
              body,
          )
          mode_match = re.search(
              r"(?mi)^\s*mode:\s*(broad|followup)\s*$",
              body,
          )
          if date_match is None:
              raise SystemExit("Issue request must contain date: today or YYYY-MM-DD.")
          if refresh_match is None:
              raise SystemExit("Issue request must contain refresh: true or false.")

          target_date = date_match.group(1)
          refresh = refresh_match.group(1).lower()
          mode = (mode_match.group(1).lower() if mode_match else "broad")
          if target_date == "today":
              target_date = datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          else:
              try:
                  target_date = datetime.strptime(target_date, "%Y-%m-%d").date().isoformat()
              except ValueError as exc:
                  raise SystemExit("Target date must be today or YYYY-MM-DD.") from exc

          request_json_b64 = ""
          wave_padded = ""
          if mode == "followup":
              followup_match = re.search(
                  r"<!-- nasdaq-cafe-research-acquisition-request -->\s*```json\s*(\{.*?\})\s*```",
                  body,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              if followup_match is None:
                  raise SystemExit("Follow-up request JSON block is missing.")
              raw_json = followup_match.group(1)
              if len(raw_json.encode("utf-8")) > 48_000:
                  raise SystemExit("Follow-up request JSON is too large.")
              try:
                  request = json.loads(raw_json)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Follow-up request JSON is invalid: {exc}") from exc
              if not isinstance(request, dict):
                  raise SystemExit("Follow-up request root must be an object.")
              if request.get("contractVersion") != "1.0.0":
                  raise SystemExit("Follow-up contractVersion must be 1.0.0.")
              if request.get("episodeDate") != target_date:
                  raise SystemExit("Follow-up episodeDate must match issue date.")
              wave = request.get("wave")
              if not isinstance(wave, int) or isinstance(wave, bool) or wave not in {1, 2}:
                  raise SystemExit("Follow-up wave must be 1 or 2.")
              requests = request.get("requests")
              if not isinstance(requests, list) or not 1 <= len(requests) <= 12:
                  raise SystemExit("Follow-up requests must contain 1 to 12 entries.")
              request_json_b64 = base64.b64encode(
                  json.dumps(
                      request,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
              ).decode("ascii")
              wave_padded = f"{wave:02d}"

          artifact_name = (
              f"nasdaq-cafe-{target_date}"
              if mode == "broad"
              else f"nasdaq-cafe-followup-{target_date}-w{wave_padded}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"date={target_date}\n")
              output.write(f"refresh={refresh}\n")
              output.write(f"mode={mode}\n")
              output.write(f"wave={wave_padded}\n")
              output.write(f"artifact_name={artifact_name}\n")
              output.write(f"request_json_b64={request_json_b64}\n")

          print(f"Target date: {target_date}")
          print(f"Refresh: {refresh}")
          print(f"Mode: {mode}")
          print(f"Artifact: {artifact_name}")
          PY

      - name: Mark request as accepted
        shell: bash
        run: |
          set -euo pipefail
          gh label create chatgpt-collect \
            --repo "$GITHUB_REPOSITORY" \
            --color "1D76DB" \
            --description "Authorized ChatGPT collection request" \
            --force
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label "chatgpt-collect"

      - name: Dispatch existing daily collector
        id: child
        shell: bash
        env:
          TARGET_DATE: ${{ steps.request.outputs.date }}
          REFRESH: ${{ steps.request.outputs.refresh }}
          MODE: ${{ steps.request.outputs.mode }}
          REQUEST_JSON_B64: ${{ steps.request.outputs.request_json_b64 }}
        run: |
          set -euo pipefail

          previous_run_id="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --event workflow_dispatch \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0'
          )"

          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f date="$TARGET_DATE" \
            -f refresh="$REFRESH" \
            -f mode="$MODE" \
            -f request_json_b64="$REQUEST_JSON_B64"

          child_run_id=""
          child_run_url=""
          for _ in $(seq 1 60); do
            run_json="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$TARGET_WORKFLOW" \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,url \
                --jq ". | map(select(.databaseId > $previous_run_id)) | sort_by(.databaseId) | first // {}"
            )"
            child_run_id="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("databaseId", ""))')"
            child_run_url="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("url", ""))')"
            if [[ -n "$child_run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$child_run_id" ]]; then
            echo "::error::Dispatched workflow run could not be located."
            exit 1
          fi

          echo "run_id=$child_run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$child_run_url" >> "$GITHUB_OUTPUT"
          echo "Child run: $child_run_url"

      - name: Wait for collector and capture result
        id: wait
        shell: bash
        env:
          CHILD_RUN_ID: ${{ steps.child.outputs.run_id }}
        run: |
          set +e
          gh run watch "$CHILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status
          watch_status=$?
          set -e

          conclusion="$(
            gh run view "$CHILD_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json conclusion \
              --jq '.conclusion // "unknown"'
          )"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "watch_status=$watch_status" >> "$GITHUB_OUTPUT"

      - name: Report request result
        if: ${{ always() }}
        shell: bash
        env:
          TARGET_DATE: ${{ steps.request.outputs.date }}
          MODE: ${{ steps.request.outputs.mode }}
          WAVE: ${{ steps.request.outputs.wave }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
          CHILD_RUN_ID: ${{ steps.child.outputs.run_id }}
          CHILD_RUN_URL: ${{ steps.child.outputs.run_url }}
          CHILD_CONCLUSION: ${{ steps.wait.outputs.conclusion }}
        run: |
          set -euo pipefail

          target_date="${TARGET_DATE:-unknown}"
          mode="${MODE:-unknown}"
          wave="${WAVE:-}"
          artifact_name="${ARTIFACT_NAME:-unavailable}"
          child_run_id="${CHILD_RUN_ID:-unknown}"
          child_run_url="${CHILD_RUN_URL:-https://github.com/$GITHUB_REPOSITORY/actions}"
          conclusion="${CHILD_CONCLUSION:-failure}"
          result_path="$RUNNER_TEMP/nasdaq-cafe-collection-result.md"

          if [[ "$conclusion" == "success" ]]; then
            cat > "$result_path" <<EOF
          <!-- nasdaq-cafe-collection-result -->

          status: success
          date: $target_date
          mode: $mode
          wave: $wave
          run_id: $child_run_id
          artifact_name: $artifact_name
          run_url: $child_run_url
          EOF

            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$result_path"
            gh issue close "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          else
            gh label create chatgpt-collect-failed \
              --repo "$GITHUB_REPOSITORY" \
              --color "D73A4A" \
              --description "ChatGPT collection request failed" \
              --force
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "chatgpt-collect-failed"

            cat > "$result_path" <<EOF
          <!-- nasdaq-cafe-collection-result -->

          status: failure
          date: $target_date
          mode: $mode
          wave: $wave
          run_id: $child_run_id
          artifact_name: unavailable
          run_url: $child_run_url
          EOF

            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$result_path"
          fi

      - name: Propagate collector failure
        if: ${{ always() && steps.wait.outputs.conclusion != 'success' }}
        shell: bash
        run: |
          echo "::error::The dispatched daily collector did not succeed."
          exit 1
