name: One-time Longbridge OAuth acceptance

on:
  push:
    branches:
      - feat/longbridge-oauth-actions
    paths:
      - .github/workflows/longbridge-acceptance.yml

permissions:
  contents: write

concurrency:
  group: longbridge-oauth-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NASDAQ_CAFE_MAX_FULLTEXT_ATTEMPTS: "25"
      NASDAQ_CAFE_FULLTEXT_WORKERS: "6"
      NASDAQ_CAFE_REQUEST_TIMEOUT_SECONDS: "20"
      NASDAQ_CAFE_MAX_ARTICLE_BYTES: "5000000"
      NASDAQ_CAFE_TAVILY_EXTRACT_BASIC_LIMIT: "20"
      NASDAQ_CAFE_TAVILY_EXTRACT_ADVANCED_LIMIT: "5"
      NASDAQ_CAFE_FMP_NEWS_LIMIT: "100"
      NASDAQ_CAFE_FMP_COMPANY_LIMIT: "10"
      NASDAQ_CAFE_SEC_LOOKBACK_DAYS: "7"
      NASDAQ_CAFE_SEC_MAX_FILINGS_PER_COMPANY: "100"

    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/longbridge-oauth-actions
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full tests
        run: python -m unittest discover -s tests -v

      - name: Install Longbridge CLI
        id: install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://open.longbridge.com/longbridge/longbridge-terminal/install | sh
          longbridge_bin="$(command -v longbridge || true)"
          if [[ -z "$longbridge_bin" ]]; then
            for candidate in "$HOME/.local/bin/longbridge" "$HOME/bin/longbridge" "/usr/local/bin/longbridge"; do
              if [[ -x "$candidate" ]]; then
                longbridge_bin="$candidate"
                break
              fi
            done
          fi
          test -n "$longbridge_bin"
          echo "$(dirname "$longbridge_bin")" >> "$GITHUB_PATH"
          echo "binary=$longbridge_bin" >> "$GITHUB_OUTPUT"
          "$longbridge_bin" -v

      - name: Run safe acceptance
        id: acceptance
        continue-on-error: true
        shell: bash
        env:
          LONGBRIDGE_BIN: ${{ steps.install.outputs.binary }}
          LONGBRIDGE_CLI_AUTH_B64: ${{ secrets.LONGBRIDGE_CLI_AUTH_B64 }}
          ROTATOR_TOKEN: ${{ secrets.LONGBRIDGE_SECRET_ROTATOR_TOKEN }}
        run: |
          set +e
          status="pass"
          reason=""
          auth_available="false"
          collector_ok="false"
          rotator_access="false"
          rotation_state="not_checked"
          target_date="$(TZ=Asia/Tokyo date +%F)"
          auth_dir="$HOME/.longbridge/openapi"
          auth_path="$auth_dir/cli-auth"
          mkdir -p "$auth_dir"
          umask 077

          if [[ -z "${LONGBRIDGE_CLI_AUTH_B64:-}" ]]; then
            status="fail"
            reason="LONGBRIDGE_CLI_AUTH_B64 is not configured"
          else
            printf '%s' "$LONGBRIDGE_CLI_AUTH_B64" | base64 --decode > "$auth_path"
            if [[ $? -ne 0 || ! -s "$auth_path" ]]; then
              status="fail"
              reason="OAuth secret could not be decoded"
            else
              chmod 600 "$auth_path"
              auth_available="true"
              before_sha="$(sha256sum "$auth_path" | awk '{print $1}')"
              "$LONGBRIDGE_BIN" auth status --format json > "$RUNNER_TEMP/auth.json"
              if [[ $? -ne 0 ]] || ! python scripts/validate_longbridge_auth_status.py "$RUNNER_TEMP/auth.json"; then
                status="fail"
                reason="Longbridge auth validation failed"
              fi
            fi
          fi

          if [[ "$status" == "pass" ]]; then
            "$LONGBRIDGE_BIN" check --format json > "$RUNNER_TEMP/check.json"
            if [[ $? -ne 0 ]] || ! python scripts/validate_longbridge_check.py "$RUNNER_TEMP/check.json"; then
              status="fail"
              reason="Longbridge connectivity validation failed"
            fi
          fi

          if [[ "$status" == "pass" ]]; then
            python -m nasdaq_cafe.run collect --date "$target_date" --refresh
            if [[ $? -ne 0 ]]; then
              status="fail"
              reason="Daily collector failed"
            fi
          fi

          quote_path="output/$target_date/raw/longbridge_quotes.json"
          if [[ "$status" == "pass" ]]; then
            python - "$quote_path" "$RUNNER_TEMP/quote-summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          payload = json.loads(source.read_text(encoding="utf-8"))
          expected = {
              ".IXIC.US", "QQQ.US", "SMH.US", "SOXX.US",
              "NVDA.US", "MSFT.US", "AAPL.US", "AMZN.US", "GOOGL.US",
              "META.US", "AVGO.US", "TSM.US", "AMD.US", "TSLA.US",
          }
          items = payload.get("items")
          if payload.get("source") != "Longbridge" or payload.get("fetched_by") != "longbridge-cli":
              raise SystemExit("unexpected Longbridge payload metadata")
          if not isinstance(items, list):
              raise SystemExit("Longbridge payload items are missing")
          returned = {str(item.get("symbol")) for item in items if isinstance(item, dict)}
          missing = sorted(expected - returned)
          if missing:
              raise SystemExit(f"missing Longbridge symbols: {missing}")
          target.write_text(
              json.dumps(
                  {
                      "item_count": len(items),
                      "returned_symbols": sorted(returned),
                      "expected_symbols_complete": True,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY
            if [[ $? -eq 0 ]]; then
              collector_ok="true"
            else
              status="fail"
              reason="Longbridge quote archive validation failed"
            fi
          fi

          if [[ -n "${ROTATOR_TOKEN:-}" ]]; then
            GH_TOKEN="$ROTATOR_TOKEN" gh secret list --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
            if [[ $? -eq 0 ]]; then
              rotator_access="true"
            elif [[ "$status" == "pass" ]]; then
              status="fail"
              reason="Rotator token cannot access repository secrets"
            fi
          elif [[ "$status" == "pass" ]]; then
            status="fail"
            reason="LONGBRIDGE_SECRET_ROTATOR_TOKEN is not configured"
          fi

          if [[ "$auth_available" == "true" && -s "$auth_path" ]]; then
            after_sha="$(sha256sum "$auth_path" | awk '{print $1}')"
            if [[ "$after_sha" == "$before_sha" ]]; then
              rotation_state="not_required"
            elif [[ "$rotator_access" == "true" ]]; then
              encoded="$(base64 -w 0 "$auth_path")"
              echo "::add-mask::$encoded"
              printf '%s' "$encoded" | GH_TOKEN="$ROTATOR_TOKEN" gh secret set LONGBRIDGE_CLI_AUTH_B64 --repo "$GITHUB_REPOSITORY"
              if [[ $? -eq 0 ]]; then
                rotation_state="rotated"
              else
                rotation_state="failed"
                status="fail"
                reason="Refreshed OAuth session could not be persisted"
              fi
            else
              rotation_state="required_but_unavailable"
            fi
          fi

          export ACCEPT_STATUS="$status"
          export ACCEPT_REASON="$reason"
          export ACCEPT_DATE="$target_date"
          export AUTH_AVAILABLE="$auth_available"
          export COLLECTOR_OK="$collector_ok"
          export ROTATOR_ACCESS="$rotator_access"
          export ROTATION_STATE="$rotation_state"
          python - "$RUNNER_TEMP/auth.json" "$RUNNER_TEMP/check.json" "$RUNNER_TEMP/quote-summary.json" "$RUNNER_TEMP/acceptance.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          def read_json(path: str):
              file = Path(path)
              if not file.exists():
                  return {}
              try:
                  return json.loads(file.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          auth = read_json(sys.argv[1])
          check = read_json(sys.argv[2])
          quotes = read_json(sys.argv[3])
          account = auth.get("account") if isinstance(auth.get("account"), dict) else {}
          token = auth.get("token") if isinstance(auth.get("token"), dict) else {}
          connectivity = check.get("connectivity") if isinstance(check.get("connectivity"), dict) else {}
          packages = account.get("activated_packages") if isinstance(account.get("activated_packages"), list) else []
          package_keys = sorted(
              str(item.get("package_key"))
              for item in packages
              if isinstance(item, dict) and item.get("package_key")
          )
          report = {
              "schema_version": "1.0",
              "status": os.environ.get("ACCEPT_STATUS", "fail"),
              "reason": os.environ.get("ACCEPT_REASON", ""),
              "target_date_jst": os.environ.get("ACCEPT_DATE", ""),
              "oauth_secret_present_and_decoded": os.environ.get("AUTH_AVAILABLE") == "true",
              "account_channel": account.get("account_channel"),
              "token_status": token.get("status"),
              "paper_account_validated": account.get("account_channel") == "lb_papertrading",
              "us_openapi_quote_package_validated": "US_QBBO_OpenAPI" in package_keys,
              "global_connectivity": bool((connectivity.get("global") or {}).get("ok")),
              "cn_connectivity": bool((connectivity.get("cn") or {}).get("ok")),
              "collector_archive_validated": os.environ.get("COLLECTOR_OK") == "true",
              "quote_item_count": quotes.get("item_count", 0),
              "returned_symbols": quotes.get("returned_symbols", []),
              "rotator_secret_access_validated": os.environ.get("ROTATOR_ACCESS") == "true",
              "oauth_rotation_state": os.environ.get("ROTATION_STATE", "not_checked"),
              "contains_oauth_material": False,
          }
          Path(sys.argv[4]).write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          exit 0

      - name: Commit safe acceptance report and remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance
          if [[ -s "$RUNNER_TEMP/acceptance.json" ]]; then
            cp "$RUNNER_TEMP/acceptance.json" acceptance/longbridge-oauth-smoke.json
          else
            cat > acceptance/longbridge-oauth-smoke.json <<'EOF'
          {
            "schema_version": "1.0",
            "status": "fail",
            "reason": "acceptance workflow ended before a safe report could be produced",
            "contains_oauth_material": false
          }
          EOF
          fi
          rm -f .github/workflows/longbridge-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acceptance/longbridge-oauth-smoke.json .github/workflows/longbridge-acceptance.yml
          git diff --cached --check
          git commit -m 'Record Longbridge OAuth acceptance result'
          git push origin HEAD:feat/longbridge-oauth-actions
