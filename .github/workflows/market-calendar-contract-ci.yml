name: Market Calendar Contract CI

on:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "nasdaq_cafe/trading_calendar.py"
      - "nasdaq_cafe/config.py"
      - "nasdaq_cafe/run.py"
      - "nasdaq_cafe/outputs/write_chatgpt_handoff.py"
      - "nasdaq_cafe/outputs/write_fulltext_handoff.py"
      - "tests/test_trading_calendar.py"
      - ".github/workflows/market-calendar-contract-ci.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "nasdaq_cafe/trading_calendar.py"
      - "nasdaq_cafe/config.py"
      - "nasdaq_cafe/run.py"
      - "nasdaq_cafe/outputs/write_chatgpt_handoff.py"
      - "nasdaq_cafe/outputs/write_fulltext_handoff.py"
      - "tests/test_trading_calendar.py"
      - ".github/workflows/market-calendar-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile calendar boundary
        run: python -m py_compile nasdaq_cafe/trading_calendar.py nasdaq_cafe/config.py nasdaq_cafe/run.py nasdaq_cafe/outputs/write_chatgpt_handoff.py nasdaq_cafe/outputs/write_fulltext_handoff.py
      - name: Trading calendar contract regression
        run: python -m unittest discover -s tests -p 'test_trading_calendar.py' -v
      - name: Full Collector regression
        run: python -m unittest discover -s tests -v
