name: Longbridge refresh preflight static check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/longbridge-refresh-preflight-static.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q nasdaq_cafe scripts tests
      - run: python -m unittest discover -s tests -v
