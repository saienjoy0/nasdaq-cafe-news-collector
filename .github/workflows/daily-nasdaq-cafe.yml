name: Daily NASDAQ Cafe collection

on:
  schedule:
    # 07:17 Asia/Tokyo (22:17 UTC on the previous day).
    # Avoid the top of the hour, when scheduled Actions are more likely to be delayed.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date: today or YYYY-MM-DD"
        required: false
        default: "today"
        type: string
      refresh:
        description: "Ignore same-day raw JSON caches"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-nasdaq-cafe
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NASDAQ_CAFE_MAX_FULLTEXT_ATTEMPTS: "25"
      NASDAQ_CAFE_FULLTEXT_WORKERS: "6"
      NASDAQ_CAFE_REQUEST_TIMEOUT_SECONDS: "20"
      NASDAQ_CAFE_MAX_ARTICLE_BYTES: "5000000"
      NASDAQ_CAFE_TAVILY_EXTRACT_BASIC_LIMIT: "20"
      NASDAQ_CAFE_TAVILY_EXTRACT_ADVANCED_LIMIT: "5"
      NASDAQ_CAFE_FMP_NEWS_LIMIT: "100"
      NASDAQ_CAFE_FMP_COMPANY_LIMIT: "10"
      NASDAQ_CAFE_SEC_LOOKBACK_DAYS: "7"
      NASDAQ_CAFE_SEC_MAX_FILINGS_PER_COMPANY: "100"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install Longbridge CLI
        id: install_longbridge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://open.longbridge.com/longbridge/longbridge-terminal/install | sh

          longbridge_bin="$(command -v longbridge || true)"
          if [[ -z "$longbridge_bin" ]]; then
            for candidate in \
              "$HOME/.local/bin/longbridge" \
              "$HOME/bin/longbridge" \
              "/usr/local/bin/longbridge"; do
              if [[ -x "$candidate" ]]; then
                longbridge_bin="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$longbridge_bin" ]]; then
            echo "::error::Longbridge CLI installation completed without a discoverable executable."
            exit 1
          fi

          echo "$(dirname "$longbridge_bin")" >> "$GITHUB_PATH"
          echo "binary=$longbridge_bin" >> "$GITHUB_OUTPUT"
          "$longbridge_bin" -V

      - name: Restore and validate Longbridge OAuth session
        id: longbridge_auth
        shell: bash
        env:
          LONGBRIDGE_CLI_AUTH_B64: ${{ secrets.LONGBRIDGE_CLI_AUTH_B64 }}
          LONGBRIDGE_BIN: ${{ steps.install_longbridge.outputs.binary }}
        run: |
          set -euo pipefail

          if [[ -z "${LONGBRIDGE_CLI_AUTH_B64:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Longbridge OAuth archive secret is not configured; collection will record Longbridge as missing."
            exit 0
          fi

          auth_dir="$HOME/.longbridge/openapi"
          archive_path="$RUNNER_TEMP/longbridge-openapi-auth.zip"
          rm -rf "$auth_dir"
          mkdir -p "$auth_dir"
          umask 077
          printf '%s' "$LONGBRIDGE_CLI_AUTH_B64" | base64 --decode > "$archive_path"
          unzip -q "$archive_path" -d "$auth_dir"
          rm -f "$archive_path"
          chmod -R go-rwx "$auth_dir"

          if [[ ! -d "$auth_dir/tokens" ]] || ! find "$auth_dir/tokens" -type f -print -quit | grep -q .; then
            echo "::error::Longbridge OAuth archive does not contain openapi/tokens/<client_id>."
            exit 1
          fi

          before_sha="$({ find "$auth_dir" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"

          "$LONGBRIDGE_BIN" auth status --format json > "$RUNNER_TEMP/longbridge-auth-status.json"
          python scripts/validate_longbridge_auth_status.py "$RUNNER_TEMP/longbridge-auth-status.json"

          "$LONGBRIDGE_BIN" check --format json > "$RUNNER_TEMP/longbridge-check.json"
          python scripts/validate_longbridge_check.py "$RUNNER_TEMP/longbridge-check.json"

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          target_date="${{ inputs.date }}"
          if [[ -z "$target_date" || "$target_date" == "today" ]]; then
            target_date="$(TZ=Asia/Tokyo date +%F)"
          fi
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Target date: $target_date"

      - name: Collect source pack and Raw Archive
        shell: bash
        run: |
          refresh_args=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "${{ inputs.refresh }}" == "true" ]]; then
            refresh_args+=(--refresh)
          fi
          python -m nasdaq_cafe.run collect \
            --date "${{ steps.target.outputs.date }}" \
            "${refresh_args[@]}"

      - name: Persist refreshed Longbridge OAuth session
        if: ${{ steps.longbridge_auth.outputs.available == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LONGBRIDGE_SECRET_ROTATOR_TOKEN }}
          BEFORE_SHA: ${{ steps.longbridge_auth.outputs.before_sha }}
        run: |
          set -euo pipefail
          auth_dir="$HOME/.longbridge/openapi"

          if [[ ! -d "$auth_dir/tokens" ]] || ! find "$auth_dir/tokens" -type f -print -quit | grep -q .; then
            echo "::error::Longbridge OAuth token directory disappeared after collection."
            exit 1
          fi

          after_sha="$({ find "$auth_dir" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
          if [[ "$after_sha" == "$BEFORE_SHA" ]]; then
            echo "Longbridge OAuth session did not change; repository secret rotation is unnecessary."
            exit 0
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Longbridge OAuth session changed, but LONGBRIDGE_SECRET_ROTATOR_TOKEN is not configured."
            exit 1
          fi

          archive_path="$RUNNER_TEMP/longbridge-openapi-auth.zip"
          rm -f "$archive_path"
          (cd "$auth_dir" && zip -qr "$archive_path" .)
          encoded="$(base64 -w 0 "$archive_path")"
          echo "::add-mask::$encoded"
          printf '%s' "$encoded" | gh secret set LONGBRIDGE_CLI_AUTH_B64 --repo "$GITHUB_REPOSITORY"
          rm -f "$archive_path"
          echo "Longbridge OAuth repository secret was rotated successfully."

      - name: Upload safe daily package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nasdaq-cafe-${{ steps.target.outputs.date }}
          path: |
            output/${{ steps.target.outputs.date }}/source_pack.md
            output/${{ steps.target.outputs.date }}/source_pack.json
            output/${{ steps.target.outputs.date }}/prompt_input.md
            output/${{ steps.target.outputs.date }}/CHATGPT_HANDOFF_*.md
          if-no-files-found: error
          retention-days: 14
