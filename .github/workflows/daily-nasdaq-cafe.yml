name: Daily NASDAQ Cafe collection

on:
  schedule:
    # 07:17 Asia/Tokyo (22:17 UTC on the previous day).
    # Avoid the top of the hour, when scheduled Actions are more likely to be delayed.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date: today or YYYY-MM-DD"
        required: false
        default: "today"
        type: string
      refresh:
        description: "Ignore same-day raw JSON caches"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-nasdaq-cafe
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NASDAQ_CAFE_MAX_FULLTEXT_ATTEMPTS: "25"
      NASDAQ_CAFE_FULLTEXT_WORKERS: "6"
      NASDAQ_CAFE_REQUEST_TIMEOUT_SECONDS: "20"
      NASDAQ_CAFE_MAX_ARTICLE_BYTES: "5000000"
      NASDAQ_CAFE_TAVILY_EXTRACT_BASIC_LIMIT: "20"
      NASDAQ_CAFE_TAVILY_EXTRACT_ADVANCED_LIMIT: "5"
      NASDAQ_CAFE_FMP_NEWS_LIMIT: "100"
      NASDAQ_CAFE_FMP_COMPANY_LIMIT: "10"
      NASDAQ_CAFE_SEC_LOOKBACK_DAYS: "7"
      NASDAQ_CAFE_SEC_MAX_FILINGS_PER_COMPANY: "100"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          target_date="${{ inputs.date }}"
          if [[ -z "$target_date" || "$target_date" == "today" ]]; then
            target_date="$(TZ=Asia/Tokyo date +%F)"
          fi
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Target date: $target_date"

      - name: Collect source pack and Raw Archive
        shell: bash
        run: |
          refresh_args=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "${{ inputs.refresh }}" == "true" ]]; then
            refresh_args+=(--refresh)
          fi
          python -m nasdaq_cafe.run collect \
            --date "${{ steps.target.outputs.date }}" \
            "${refresh_args[@]}"

      - name: Upload safe daily package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nasdaq-cafe-${{ steps.target.outputs.date }}
          path: |
            output/${{ steps.target.outputs.date }}/source_pack.md
            output/${{ steps.target.outputs.date }}/source_pack.json
            output/${{ steps.target.outputs.date }}/prompt_input.md
            output/${{ steps.target.outputs.date }}/CHATGPT_HANDOFF_*.md
          if-no-files-found: error
          retention-days: 14
