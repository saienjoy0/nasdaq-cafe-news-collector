name: Daily NASDAQ Cafe collection

on:
  schedule:
    # 07:17 Asia/Tokyo (22:17 UTC on the previous day).
    # Avoid the top of the hour, when scheduled Actions are more likely to be delayed.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date: today or YYYY-MM-DD"
        required: false
        default: "today"
        type: string
      refresh:
        description: "Ignore same-day raw JSON caches"
        required: false
        default: true
        type: boolean
      mode:
        description: "Collection mode"
        required: false
        default: "broad"
        type: choice
        options:
          - broad
          - followup
      request_json_b64:
        description: "Base64 research acquisition request; followup mode only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Refresh tokens may rotate. Never let two jobs refresh the same secret at once.
  group: daily-nasdaq-cafe
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NASDAQ_CAFE_MAX_FULLTEXT_ATTEMPTS: "25"
      NASDAQ_CAFE_FULLTEXT_WORKERS: "6"
      NASDAQ_CAFE_REQUEST_TIMEOUT_SECONDS: "20"
      NASDAQ_CAFE_MAX_ARTICLE_BYTES: "5000000"
      NASDAQ_CAFE_TAVILY_EXTRACT_BASIC_LIMIT: "20"
      NASDAQ_CAFE_TAVILY_EXTRACT_ADVANCED_LIMIT: "5"
      NASDAQ_CAFE_FMP_NEWS_LIMIT: "100"
      NASDAQ_CAFE_FMP_COMPANY_LIMIT: "10"
      NASDAQ_CAFE_SEC_LOOKBACK_DAYS: "7"
      NASDAQ_CAFE_SEC_MAX_FILINGS_PER_COMPANY: "100"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install Longbridge CLI
        id: install_longbridge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://open.longbridge.com/longbridge/longbridge-terminal/install | sh

          longbridge_bin="$(command -v longbridge || true)"
          if [[ -z "$longbridge_bin" ]]; then
            for candidate in \
              "$HOME/.local/bin/longbridge" \
              "$HOME/bin/longbridge" \
              "/usr/local/bin/longbridge"; do
              if [[ -x "$candidate" ]]; then
                longbridge_bin="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$longbridge_bin" ]]; then
            echo "::error::Longbridge CLI installation completed without a discoverable executable."
            exit 1
          fi

          echo "$(dirname "$longbridge_bin")" >> "$GITHUB_PATH"
          echo "binary=$longbridge_bin" >> "$GITHUB_OUTPUT"
          "$longbridge_bin" -V

      - name: Refresh, persist, and validate portable Longbridge OAuth
        id: longbridge_auth
        shell: bash
        env:
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_REFRESH_TOKEN: ${{ secrets.LONGBRIDGE_OAUTH_REFRESH_TOKEN }}
          LONGBRIDGE_BIN: ${{ steps.install_longbridge.outputs.binary }}
          GH_TOKEN: ${{ secrets.LONGBRIDGE_SECRET_ROTATOR_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${LONGBRIDGE_OAUTH_CLIENT_ID:-}" && -z "${LONGBRIDGE_OAUTH_REFRESH_TOKEN:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Portable Longbridge OAuth secrets are not configured; collection will record Longbridge as missing."
            exit 0
          fi

          if [[ -z "${LONGBRIDGE_OAUTH_CLIENT_ID:-}" || -z "${LONGBRIDGE_OAUTH_REFRESH_TOKEN:-}" ]]; then
            echo "::error::Both LONGBRIDGE_OAUTH_CLIENT_ID and LONGBRIDGE_OAUTH_REFRESH_TOKEN are required."
            exit 1
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::LONGBRIDGE_SECRET_ROTATOR_TOKEN is required before refreshing OAuth."
            exit 1
          fi

          echo "::add-mask::$LONGBRIDGE_OAUTH_REFRESH_TOKEN"
          printf '%s' "$LONGBRIDGE_OAUTH_REFRESH_TOKEN" | \
            gh secret set LONGBRIDGE_OAUTH_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Longbridge refresh-token write preflight succeeded."

          next_refresh_path="$RUNNER_TEMP/longbridge-next-refresh-token"
          export LONGBRIDGE_NEXT_REFRESH_TOKEN_PATH="$next_refresh_path"
          python scripts/prepare_longbridge_oauth_session.py

          if [[ ! -s "$next_refresh_path" ]]; then
            echo "::error::Longbridge OAuth refresh did not produce a reusable refresh token."
            exit 1
          fi

          next_refresh_token="$(cat "$next_refresh_path")"
          echo "::add-mask::$next_refresh_token"
          printf '%s' "$next_refresh_token" | \
            gh secret set LONGBRIDGE_OAUTH_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          rm -f "$next_refresh_path"
          echo "Longbridge OAuth refresh token was persisted successfully."

          "$LONGBRIDGE_BIN" auth status --format json > "$RUNNER_TEMP/longbridge-auth-status.json"
          python scripts/validate_longbridge_auth_status.py "$RUNNER_TEMP/longbridge-auth-status.json"

          "$LONGBRIDGE_BIN" check --format json > "$RUNNER_TEMP/longbridge-check.json"
          python scripts/validate_longbridge_check.py "$RUNNER_TEMP/longbridge-check.json"

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Resolve target date and mode
        id: target
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          target_date="${REQUESTED_DATE:-today}"
          if [[ -z "$target_date" || "$target_date" == "today" ]]; then
            target_date="$(TZ=Asia/Tokyo date +%F)"
          fi
          mode="${REQUESTED_MODE:-broad}"
          if [[ "$mode" != "broad" && "$mode" != "followup" ]]; then
            echo "::error::mode must be broad or followup."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$mode" != "broad" ]]; then
            echo "::error::Scheduled collection is broad-only."
            exit 1
          fi
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Target date: $target_date"
          echo "Mode: $mode"

      - name: Prepare follow-up request
        if: ${{ steps.target.outputs.mode == 'followup' }}
        id: followup
        shell: bash
        env:
          REQUEST_JSON_B64: ${{ inputs.request_json_b64 }}
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          if [[ -z "${REQUEST_JSON_B64:-}" ]]; then
            echo "::error::followup mode requires request_json_b64."
            exit 1
          fi
          request_path="$RUNNER_TEMP/research_acquisition_request.json"
          printf '%s' "$REQUEST_JSON_B64" | base64 --decode > "$request_path"
          python - "$request_path" "$TARGET_DATE" <<'PY'
          import json
          import sys
          from pathlib import Path
          from nasdaq_cafe.research_acquisition import validate_request_document

          path = Path(sys.argv[1])
          target_date = sys.argv[2]
          value = json.loads(path.read_text(encoding="utf-8"))
          normalized = validate_request_document(value, episode_date=target_date)
          path.write_text(
              json.dumps(normalized, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(normalized["wave"])
          PY
          wave="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["wave"])' "$request_path")"
          echo "request_path=$request_path" >> "$GITHUB_OUTPUT"
          printf -v wave_padded '%02d' "$wave"
          echo "wave=$wave_padded" >> "$GITHUB_OUTPUT"

      - name: Collect broad source pack and Raw Archive
        if: ${{ steps.target.outputs.mode == 'broad' }}
        shell: bash
        run: |
          refresh_args=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "${{ inputs.refresh }}" == "true" ]]; then
            refresh_args+=(--refresh)
          fi
          python -m nasdaq_cafe.run collect \
            --date "${{ steps.target.outputs.date }}" \
            "${refresh_args[@]}"

      - name: Collect targeted research follow-up
        if: ${{ steps.target.outputs.mode == 'followup' }}
        shell: bash
        run: |
          refresh_args=()
          if [[ "${{ inputs.refresh }}" == "true" ]]; then
            refresh_args+=(--refresh)
          fi
          python -m nasdaq_cafe.research_acquisition \
            --date "${{ steps.target.outputs.date }}" \
            --request "${{ steps.followup.outputs.request_path }}" \
            "${refresh_args[@]}"

      - name: Upload safe daily package
        if: ${{ steps.target.outputs.mode == 'broad' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nasdaq-cafe-${{ steps.target.outputs.date }}
          path: |
            output/${{ steps.target.outputs.date }}/source_pack.md
            output/${{ steps.target.outputs.date }}/source_pack.json
            output/${{ steps.target.outputs.date }}/prompt_input.md
            output/${{ steps.target.outputs.date }}/CHATGPT_HANDOFF_*.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload safe follow-up package
        if: ${{ steps.target.outputs.mode == 'followup' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nasdaq-cafe-followup-${{ steps.target.outputs.date }}-w${{ steps.followup.outputs.wave }}
          path: |
            output/${{ steps.target.outputs.date }}/followup/wave-${{ steps.followup.outputs.wave }}/
            output/${{ steps.target.outputs.date }}/raw/followup/wave-${{ steps.followup.outputs.wave }}/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Longbridge OAuth material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$HOME/.longbridge/openapi"
          rm -f "$RUNNER_TEMP/longbridge-next-refresh-token"
          rm -f "$RUNNER_TEMP/longbridge-auth-status.json"
          rm -f "$RUNNER_TEMP/longbridge-check.json"
          rm -f "$RUNNER_TEMP/research_acquisition_request.json"
