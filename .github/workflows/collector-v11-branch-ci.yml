name: Collector v1.1 Branch CI

on:
  push:
    branches:
      - impl/collector-broad-discovery-v1-1
    paths:
      - "nasdaq_cafe/**"
      - "tests/**"
      - ".github/workflows/collector-v11-branch-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile collector v1.1 modules
        run: |
          python -m py_compile \
            nasdaq_cafe/run.py \
            nasdaq_cafe/processing/research_candidate_pool.py \
            nasdaq_cafe/collectors/search_discovery_collector.py \
            nasdaq_cafe/collectors/gdelt_perspective_collector.py \
            nasdaq_cafe/collectors/cross_market_snapshot_collector.py \
            nasdaq_cafe/outputs/write_chatgpt_handoff_v11.py

      - name: Run collector v1.1 regression tests
        run: python tests/test_collector_broad_discovery_v11.py

      - name: Run existing unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py'
