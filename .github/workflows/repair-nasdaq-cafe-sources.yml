name: One-time NASDAQ Cafe source repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .repair/recovery_xz/**
      - .github/workflows/repair-nasdaq-cafe-sources.yml

permissions:
  contents: write

concurrency:
  group: repair-nasdaq-cafe-sources
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/longbridge-oauth-actions
          fetch-depth: 0

      - name: Verify and restore three clean sources
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/chunks.sha256" <<'EOF'
          a543335d753feac8730f4bd96de4366a90fc11ffcaab0ecb3a7247db633db0e0  .repair/recovery_xz/part00
          5aa7e3fe380764ac026565a99465f602f5aa18fa81cdac4dd77e52806097f292  .repair/recovery_xz/part01
          d82b902facffa924981b0a3de20284f1814effbaf130d55c3e49c644d3db0ce5  .repair/recovery_xz/part02
          d8d62886454ad253bfa8052e08bb28d5f0527875c098c9a177973f1fbb99bb6c  .repair/recovery_xz/part03
          aceefcdb45edc5dd2f6302387487438e9d9e0a4b105f1eb6e55d8b1e77d69aee  .repair/recovery_xz/part04
          0eaa9e0a977728e86d5e22106ff11ba3cff23ec75b9931cbc5c0f9e4910d5a70  .repair/recovery_xz/part05
          238f7558cc0f44d5bbf065edd343b85e3fa316b11c663c662b01f3db38360d62  .repair/recovery_xz/part06
          832a14db812135b0d706246e9185d9c0192735f90eb6ea2763f135cc59d191e3  .repair/recovery_xz/part07
          EOF
          sha256sum -c "$RUNNER_TEMP/chunks.sha256"

          cat .repair/recovery_xz/part{00..07} > "$RUNNER_TEMP/repair.tar.xz.b64"
          test "$(wc -c < "$RUNNER_TEMP/repair.tar.xz.b64")" -eq 30776
          base64 --decode "$RUNNER_TEMP/repair.tar.xz.b64" > "$RUNNER_TEMP/repair.tar.xz"
          echo 'fa086299fb673bf76d0fc283d2c87a9e144620e26c315f8ea529d641e7c92857  REPAIR_TAR' | \
            sed "s#REPAIR_TAR#$RUNNER_TEMP/repair.tar.xz#" | sha256sum -c -
          xz -t "$RUNNER_TEMP/repair.tar.xz"

          restore_dir="$RUNNER_TEMP/restore"
          mkdir -p "$restore_dir"
          tar -xJf "$RUNNER_TEMP/repair.tar.xz" -C "$restore_dir"

          find "$restore_dir" -type f -printf '%P\n' | sort > "$RUNNER_TEMP/restored-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          nasdaq_cafe/collectors/article_fulltext_collector.py
          nasdaq_cafe/collectors/gdelt_radar_collector.py
          nasdaq_cafe/outputs/write_chatgpt_handoff.py
          EOF
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/restored-files.txt"

          echo 'a37b241544e1f3423584c3c1a96b1f6881db1f68995d9069d29e6244c33b6976  RESTORE/nasdaq_cafe/collectors/article_fulltext_collector.py' > "$RUNNER_TEMP/restored.sha256"
          echo '3898e7b34d99d056750b7dfe43db6254d4e2ff41f7747ac4742627c57622c392  RESTORE/nasdaq_cafe/collectors/gdelt_radar_collector.py' >> "$RUNNER_TEMP/restored.sha256"
          echo 'cc70e910402139a9b8af25a347a057f5e996f34fbd139dcd25983090a734a682  RESTORE/nasdaq_cafe/outputs/write_chatgpt_handoff.py' >> "$RUNNER_TEMP/restored.sha256"
          sed -i "s#RESTORE#$restore_dir#" "$RUNNER_TEMP/restored.sha256"
          sha256sum -c "$RUNNER_TEMP/restored.sha256"

          cp "$restore_dir/nasdaq_cafe/collectors/article_fulltext_collector.py" nasdaq_cafe/collectors/
          cp "$restore_dir/nasdaq_cafe/collectors/gdelt_radar_collector.py" nasdaq_cafe/collectors/
          cp "$restore_dir/nasdaq_cafe/outputs/write_chatgpt_handoff.py" nasdaq_cafe/outputs/

          python -m compileall -f -q nasdaq_cafe
          git diff --check

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Commit repaired sources and remove temporary material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair
          rm -f .github/workflows/repair-nasdaq-cafe-sources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore clean NASDAQ Cafe Python sources'
          git push origin HEAD:feat/longbridge-oauth-actions
