name: One-time NASDAQ Cafe source audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-nasdaq-cafe-sources.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compile every Python source
        shell: bash
        run: |
          set +e
          python -m compileall -f nasdaq_cafe > "$RUNNER_TEMP/compileall.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/compileall.log"
          exit "$status"
