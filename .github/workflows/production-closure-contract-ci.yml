name: Production Closure Contract CI

on:
  push:
    branches:
      - fix/production-closure-v1-2
    paths:
      - "nasdaq_cafe/collection_policy.py"
      - "nasdaq_cafe/provider_capability.py"
      - "nasdaq_cafe/config.py"
      - "nasdaq_cafe/run.py"
      - ".github/workflows/daily-nasdaq-cafe.yml"
      - "tests/test_collection_policy.py"
      - ".github/workflows/production-closure-contract-ci.yml"
  pull_request:
    paths:
      - "nasdaq_cafe/collection_policy.py"
      - "nasdaq_cafe/provider_capability.py"
      - "nasdaq_cafe/config.py"
      - "nasdaq_cafe/run.py"
      - ".github/workflows/daily-nasdaq-cafe.yml"
      - "tests/test_collection_policy.py"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_collection_policy.py' -v
      - run: python -m unittest discover -s tests -v
